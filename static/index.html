	<script>
		var page_value_changed = 0;//界面正在设置值的时候不刷新
		var is_waitting_response = 0;//上次查询未返回就不要发起新的查询。


		function pageValueChange() {
			page_value_changed = 1;
			//alert('Range value change');
		};

		class DataBuffer {

			constructor(size) {
				this.size = size;
				this.buffer = new Array();
			}

			isFull() {
				if (this.buffer.length >= this.size) {
					return true;
				}
				return false;
			}
			add(data) {
				if (this.isFull()) {
					this.buffer.shift();
				}
				this.buffer.push(data);
				console.log("buffer size:" + this.buffer.length)
			}

			getTempPlotData() {
				let data = [];
				for (const i in this.buffer) {
					let json = this.buffer[i];
					data.push([123, json.temp])
				}
				return data
			}

			getHumiPlotData() {
				let data = [];
				for (const i in this.buffer) {
					let json = this.buffer[i];
					data.push([123, json.humi])
				}
				return data
			}

			getPresurePlotData() {
				let data = [];
				for (const i in this.buffer) {
					let json = this.buffer[i];
					data.push([123, json.presure])
				}
				return data
			}

			getLuminancePlotData() {
				let data = [];
				for (const i in this.buffer) {
					let json = this.buffer[i];
					data.push([123, json.luminance])
				}
				return data
			}

			getPlotData() {

				let plotData = {
					x: [],
					temp: [],
					humi: [],
					pm25: [],
					luminance: [],
					presure: [],
					Ptotal:0,
					fineHThreshold:0,
					fineLThreshold:0
				}

				plotData.x = Array.from({ length: this.buffer.length }, (_, i) => i);

				plotData.x = plotData.x.reverse();
				const invalidValue = -9999;
				for (const i in this.buffer) {
					let json = this.buffer[i];
					plotData.temp[i] = json.temp == invalidValue ? undefined : json.temp
					plotData.humi[i] = json.humi == invalidValue ? undefined : json.humi
					plotData.pm25[i] = json.pm25 == invalidValue ? undefined : json.pm25
					plotData.luminance[i] = json.luminance == invalidValue ? undefined : json.luminance
					plotData.presure[i] = json.presure == invalidValue ? undefined : json.presure
				}
				if(this.buffer.length > 0){
					plotData.Ptotal = this.buffer[this.buffer.length-1].Ptotal
					plotData.fineHThreshold = this.buffer[this.buffer.length-1].fineHThreshold
					plotData.fineLThreshold = this.buffer[this.buffer.length-1].fineTempThreshold
				}
				
				return plotData
			}
		}

		var bufferLength = 350 //350*5=1800s=半小时
		var dataBuffer = new DataBuffer(bufferLength);


		function autoRefreshTimerHandler() {

			console.log("timer run.")
			//if the page content changed then bypass a query
			if (0 != page_value_changed) {
				page_value_changed = 0
				return;
			}
			if (0 != is_waitting_response) {
				return;
			} else {
				is_waitting_response = 1;
			}
			var pwd = $('#devicepwd').val();
			console.log("Requesting status with pwd: '" + pwd + "'");
			$.get('../status?mode=get&devicepwd=' + pwd)
				.done(function(resJsonStr) {
					console.log("Response received: " + resJsonStr);
					resJson = JSON.parse(resJsonStr)
					is_waitting_response = 0;
					switch (resJson.errCode) {
					case '0': {
						dataBuffer.add(resJson)
						let lineData = dataBuffer.getPlotData()
						console.log("data:" + lineData)

						const data = monitorChart.data


						for (let index = 0; index < data.datasets.length; ++index) {
							

							if (data.datasets[index].label == '温度') {
								if (data.datasets[index].data.length >= bufferLength) {
									data.datasets[index].data.shift()
								}
								data.datasets[index].data.push(lineData.temp.at(-1))
							}

							if (data.datasets[index].label == '湿度') {
								if (data.datasets[index].data.length >= bufferLength) {
									data.datasets[index].data.shift()
								}
								data.datasets[index].data.push(lineData.humi.at(-1))
								data.datasets[index].hidden = true
							}

							if (data.datasets[index].label == '功率') {
								if (data.datasets[index].data.length >= bufferLength) {
									data.datasets[index].data.shift()
								}
								data.datasets[index].data.push(lineData.Ptotal)
								data.datasets[index].hidden = false
							}

							if (data.datasets[index].label == '高阈值') {
								if (data.datasets[index].data.length >= bufferLength) {
									data.datasets[index].data.shift()
								}
								data.datasets[index].data.push(lineData.fineHThreshold)
							}

							if (data.datasets[index].label == '低阈值') {
								if (data.datasets[index].data.length >= bufferLength) {
									data.datasets[index].data.shift()
								}
								data.datasets[index].data.push(lineData.fineLThreshold)
							}
						}

						data.labels = lineData.x
						
						monitorChart.update()

						$('#sw_1_name').html(resJson.sw1name);
						$('#sw_2_name').html(resJson.sw2name);
						$('#input_switch_1_name').val(resJson.sw1name);
						$('#input_switch_2_name').val(resJson.sw2name);
						$('#device_name_show').html(resJson.devicename);
						$('#device_name').val(resJson.devicename);
						$('#serverurl').val(resJson.serverurl);
						$('#id_runtime').text(resJson.runTime + 's');
						$('#id_totalRuntime').text(resJson.totalRunTime + 's');
						$('#id_currentAvg').text(resJson.Iavg.toFixed(3) + 'A');
						$('#id_totalEnergy').text((resJson.Eaed/1000.0).toFixed(3) + 'kWh');
						$('#id_powerFreq').text(resJson.Freq.toFixed(3) + 'Hz');
						$('#id_totalPower').text(resJson.Ptotal.toFixed(3) + 'kW');
						$('#id_temp').text(resJson.temp + '℃');
						$('#id_wetBulbTemp').text(resJson.wetBulbTemp + '℃');
						$('#id_humity').text(resJson.humi + 'RH%');
						$('#id_voltageAvg').text(resJson.Van.toFixed(3) + 'V');
						$('#id_totalPowerFactor').text(resJson.PFtotal.toFixed(3));
						$('#id_presure').text(resJson.presure + 'Pa');
						$('#id_luminance').text(resJson.luminance + 'Lux');
						$('#id_pm2_5').text(resJson.pm25 + 'μg/m³');
						$('#pwm_freq').val(resJson.pwmFreq);
						$('#pwm_min_duty').val(resJson.pwmMinDuty);
						$('#pwm_max_duty').val(resJson.pwmMaxDuty);

						var mode = resJson.mode;
						console.log("Mode value: '" + mode + "'");
						var deviceControl = document.getElementById('device-control');
						var networkConfig = document.getElementById('network-config');
						if ('normal' == mode) {
							console.log("Showing device control");
							deviceControl.style.display = 'block';
							networkConfig.style.display = 'none';
							$('#device_name').attr("disabled", "disabled");
							$('#devicepwd').attr("disabled", "disabled");
							$('#serverurl').attr("disabled", "disabled");
							$('#ssid').attr("disabled", "disabled");
							$('#input-pwd').attr("disabled", "disabled");
							$('#scanap').attr("disabled", "true");
							$('#connect').attr("disabled", "true");
							$('#input_switch_1_name').attr("disabled", "disabled");
							$('#input_switch_2_name').attr("disabled", "disabled");
							if (!resJson.sw1) {
								//console.log('close switch 1');
								$("#checkbox_1").removeAttr("checked");
							} else {
								//console.log('open switch 1');
								$('#checkbox_1').attr('checked', true);
							}
							if (!resJson.sw2) {
								//console.log('close switch 2');
								$("#checkbox_2").removeAttr("checked");
							} else {
								//console.log('open switch 2');
								$('#checkbox_2').attr('checked', true);
							}

						} else {
							console.log("Showing network config");
							deviceControl.style.display = 'none';
							networkConfig.style.display = 'block';
							$('#color_r').attr("disabled", "true");
							$('#color_g').attr("disabled", "true");
							$('#color_b').attr("disabled", "true");
							$('#checkbox_1').attr("disabled", "true");
							$('#checkbox_2').attr("disabled", "true");
							$('#btn_switch').attr("disabled", "true");
						}
					}
						break;
					case '-1':
						//alert('Wrong password!');
						$('#id_temp').text('query failed.');
						$('#id_humity').text('query failed.');
						$('#id_presure').text('query failed.');
						$('#id_luminance').text('query failed.');
						$('#id_pm2_5').text('query failed.');
						break;
					default:
						//alert('Unkonwn error!\n'+resJson.msg);
						$('#id_temp').text('unkonwn.');
						$('#id_humity').text('unkonwn.');
						$('#id_presure').text('unkonwn.');
						$('#id_luminance').text('unkonwn.');
						$('#id_pm2_5').text('unkonwn.');
						break;
				}
			}).catch(function (e) {
				is_waitting_response = 0
				console.log("query error.")
			});
		}


		window.addEventListener('DOMContentLoaded', function() {
			console.log("DOM fully loaded");
			var defaultPwd = "pengping";
			$('#devicepwd').val(defaultPwd);
			setTimeout(function() {
				autoRefreshTimerHandler();
				var queryTempTimer = setInterval(autoRefreshTimerHandler, 5000);
			}, 100);
		});
	</script>




	<script>
		String.prototype.format = function () {
			var args = arguments;
			return this.replace(/\{(\d+)\}/g, function (m, i) {
				return args[i];
			});
		}

		$(function () {
			$('#btn_switch').click(function () {
				page_value_changed = 1
				$('#btn_switch').addClass('loading').prop(
					'disabled', true);
				$.get('../status?mode=set&devicepwd={0}&fineHThreshold={1}&fineLThreshold={2}&pwmFreq={3}&pwmMinDuty={4}&pwmMaxDuty={5}&sprayPeriod={6}&minSparyTime={7}&minAddWaterInterval={8}&sw1={9}&sw2={10}'.format(
					$('#devicepwd').val(),
					$('#threhold_h').val(),
					$('#threhold_l').val(),
					$('#pwm_freq').val(),
					$('#pwm_min_duty').val(),
					$('#pwm_max_duty').val(),
					$('#spray_period').val(),
					$('#min_spary_time').val(),
					$('#min_add_water_interval').val(),
					$('#checkbox_1').is(':checked'),
					$('#checkbox_2').is(':checked')),
					function (resJsonStr) {
						$('#btn_switch').removeClass('loading').prop('disabled', false);
						resJson = JSON.parse(resJsonStr)
						switch (resJson.errCode) {
							case '0':
								alert('success!\n');
								break;
							case '-1':
								alert('Wrong password!');
								break;
							default:
								alert('Unkonwn error!\n'
									+ resJson.msg);
						}
						;

					});
			});

			$('#btn_restart').click(function () {
				page_value_changed = 1
				$('#btn_restart').addClass('loading').prop('disabled', true);

				$.get('../restart?devicepwd={0}'.format($('#devicepwd').val()),
					function (resJsonStr) {
						$('#btn_restart').removeClass('loading').prop('disabled', false);
						resJson = JSON.parse(resJsonStr)
						switch (resJson.errCode) {
							case '0':
								alert('Control success!\n');
								break;
							case '-1':
								alert('Wrong password!');
								break;
							default:
								alert('Unkonwn error!\n'
									+ resJson.msg);
						}
						;

					});
			});

			$('#btn_reset').click(function () {
				page_value_changed = 1
				$('#btn_reset').addClass('loading').prop('disabled', true);

				$.get('../reset?devicepwd={0}'.format($('#devicepwd').val()),
					function (resJsonStr) {
						$('#btn_reset').removeClass('loading').prop('disabled', false);
						resJson = JSON.parse(resJsonStr)
						switch (resJson.errCode) {
							case '0':
								alert('Control success!\n');
								break;
							case '-1':
								alert('Wrong password!');
								break;
							default:
								alert('Unkonwn error!\n'
									+ resJson.msg);
						}
						;

					});
			});

			$('#connect').click(function () {
				page_value_changed = 1
				$('#connect').addClass('loading').prop('disabled', true);

				$.get('../setwifi?ssid={0}&pwd={1}&serverurl={2}&devicepwd={3}&devicename={4}&sw1name={5}&sw2name={6}'
					.format($('#ssid').val(),
						$('#input-pwd').val(),
						$('#serverurl').val(),
						$('#devicepwd').val(),
						$('#device_name').val(),
						$('#input_switch_1_name').val(),
						$('#input_switch_2_name').val()
					),
					function (resJsonStr) {
						$('#connect').removeClass(
							'loading').prop(
								'disabled', false);
						resJson = JSON.parse(resJsonStr)
						switch (resJson.errCode) {
							case '0':
								alert('Connect success!\nPlease connect to AP:['
									+ resJson.APName
									+ '] \nand then open:['
									+ resJson.url
									+ '] by web browser.');
								break;
							case '-1':
								alert('ERROR!\n'
									+ resJson.msg);
								break;
							default:
								alert('Unkonwn error!\n'
									+ resJson.msg);
						}
						;
					});
			});

			$('#scanap')
				.click(
					function () {
						page_value_changed = 1
						$('#scanap').addClass('loading').prop(
							'disabled', true);

						$
							.get(
								'../scanap',
								function (resJsonStr) {
									$('#scanap').removeClass(
										'loading').prop(
											'disabled', false);

									var template = $('#item-ap')
										.html();
									var cos45 = sin45 = 0.70710678118655;
									var html = '';
									var count = 0;
									resJson = JSON.parse(resJsonStr)
									for (ssid in resJson) {

										count = count + 1;
										//var absRSSI=Math.abs(resJson[ssid])
										var r = 0.3333 * Math.abs(resJson[ssid]) + 33.3333;
										r = r > 20 ? 20
											: (r < 0 ? 0
												: r)

										html += template
											.format(
												15
												- r
												* cos45,
												20
												- r
												* sin45,
												r,
												15
												+ r
												* cos45,
												ssid);
										if (count > 20) {
											break;
										}
									}
									if (0 >= count) {
										alert('Can not find anly AP.');
										return;
									}
									$('#aplist').html(html)
									$('#selectwifi').addClass(
										'active');

									$("#aplist div")
										.click(
											function () {
												$(
													'#selectwifi')
													.removeClass(
														'active');

												var ssid = $(
													this)
													.children(
														'.chip-content')
													.html()
												$(
													'#ssid')
													.val(
														ssid);
											});
								});
					});
		})
	</script>
</body>

</html>
